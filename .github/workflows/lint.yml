name: Auto Linter

on: 
  push: 
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      - name: Install linter
        run: pip install ruff

      - name: check the files for linting
        run: ruff check --diff .
